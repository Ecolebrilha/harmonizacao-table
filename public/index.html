<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínicas de Harmonização Facial em Garanhuns-PE</title>
    <link rel="stylesheet" href="%PUBLIC_URL%/styles/App.css">
    <!-- Estilos rápidos para destacar o título principal renderizado pelo React -->
    <style>
        /* aplica-se ao h2 dentro do componente .clinic-table */
        .clinic-table h2 {
            font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 2rem;
            font-weight: 900;
            margin: 18px 0;
            text-align: center;
            background: linear-gradient(90deg, #ff8a00 0%, #e52e71 50%, #4f5bd5 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 6px 20px rgba(229,46,113,0.06);
            letter-spacing: 0.2px;
        }

        /* leve ajuste de fundo para destacar o cartão */
        body {
            background: #f5f7fb;
        }
    </style>
</head>
<body>
    <div id="root"></div>
</body>
</html>
